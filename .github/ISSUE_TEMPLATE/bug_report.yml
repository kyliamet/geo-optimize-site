name: Bug report
description: Report incorrect routing, unsafe guidance, or a reproducible skill failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the skill. Remove secrets and private site information before submitting.
  - type: textarea
    id: request
    attributes:
      label: User request
      description: What request was given to Codex? Redact private details.
      placeholder: Paste the smallest request that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What did the skill do, omit, or misunderstand?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version or commit
      placeholder: v1.0.0 or commit SHA
  - type: textarea
    id: context
    attributes:
      label: Relevant environment details
      description: Include the framework or deployment model only when relevant.
